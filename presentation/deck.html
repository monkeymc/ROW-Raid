<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baron's Night Banquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0b1a;
  --bg-2: #161331;
  --panel: rgba(255, 255, 255, 0.04);
  --line: rgba(255, 255, 255, 0.10);
  --text: #ece8ff;
  --muted: #a49fc4;
  --gold: #e6c27a;
  --cyan: #6fd6ff;
  --violet: #9b7bff;
  --tip-bg: #fdf8ec;
  --tip-text: #231d33;
  --serif: "Cinzel", Georgia, serif;
  --sans: "Inter", "Noto Sans Thai", system-ui, sans-serif;
  --thai: "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 90% at 70% 0%, #2a1f5c 0%, var(--bg-2) 40%, var(--bg) 100%);
  color: var(--text);
  font: 16px/1.55 var(--sans);
  overflow: hidden;
}
a { color: var(--cyan); }

.deck { position: relative; height: 100dvh; overflow: hidden; }
.slide {
  position: absolute; inset: 0;
  padding: clamp(16px, 4vw, 56px) clamp(16px, 5vw, 72px) 96px;
  display: grid; align-content: center;
  opacity: 0; visibility: hidden; transform: translateX(24px);
  transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
  overflow-y: auto;
}
.slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .35s ease, transform .35s ease; }

.eyebrow { font: 600 12px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
h1, h2 { font-family: var(--serif); font-weight: 700; margin: 0; letter-spacing: .01em; }
.th { font-family: var(--thai); }

/* Title slide */
.title-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(16px, 4vw, 56px); align-items: center; max-width: 1280px; margin: 0 auto; width: 100%; }
.title-grid img { width: 100%; max-height: 70dvh; object-fit: contain; filter: drop-shadow(0 20px 60px rgba(111, 214, 255, .25)); }
.title-grid h1 { font-size: clamp(32px, 5.4vw, 72px); line-height: 1.05; margin: 14px 0 6px; }
.title-grid .th-sub { font-size: clamp(18px, 2.2vw, 26px); color: var(--muted); }
.boss-line { margin: 22px 0 18px; font-size: 18px; }
.boss-line strong { color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.chip b { color: var(--text); font-weight: 600; }
.chip.tone { border-color: rgba(230, 194, 122, .45); color: var(--gold); background: rgba(230, 194, 122, .08); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 24px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stat dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat dd { margin: 2px 0 0; font: 600 18px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.hint { margin-top: 26px; font-size: 13px; color: var(--muted); }
kbd { font: 12px var(--sans); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }

/* Skill slide */
.skill-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(16px, 3vw, 44px); align-items: center; max-width: 1440px; margin: 0 auto; width: 100%; }
.video-frame { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #000; box-shadow: 0 30px 80px rgba(0, 0, 0, .5), 0 0 0 1px rgba(155, 123, 255, .15); aspect-ratio: 16 / 9; }
.video-frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
.video-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.icon-btn { appearance: none; border: 1px solid rgba(255, 255, 255, .25); background: rgba(13, 11, 26, .7); color: var(--text); border-radius: 999px; padding: 6px 12px; font: 500 12px var(--sans); cursor: pointer; backdrop-filter: blur(6px); }
.icon-btn:hover { border-color: var(--gold); color: var(--gold); }
.credit { margin-top: 10px; font-size: 12px; color: var(--muted); }
.skill-num { font: 700 14px/1 var(--serif); color: var(--violet); letter-spacing: .1em; }
.skill-info h2 { font-size: clamp(28px, 3.6vw, 48px); line-height: 1.1; margin: 10px 0 4px; }
.skill-info .th-name { font-size: 20px; color: var(--muted); margin-bottom: 14px; }
.skill-info .chips { margin-bottom: 18px; }

.desc {
  position: relative;
  margin: 0; padding: 16px 18px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  border-radius: 10px;
  font-size: clamp(16px, 1.35vw, 19px);
  cursor: help;
  transition: border-color .2s, background .2s;
}
.desc:hover, .desc:focus-visible, .desc.tip-open { background: rgba(230, 194, 122, .07); border-color: rgba(230, 194, 122, .5); outline: none; }
.desc-hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.desc-hint span { font: 600 10px/1 var(--sans); color: var(--bg); background: var(--gold); border-radius: 4px; padding: 3px 5px; }

/* Thai tooltip */
.tip {
  position: fixed; z-index: 50; max-width: min(440px, calc(100vw - 32px));
  background: var(--tip-bg); color: var(--tip-text);
  border-radius: 12px; padding: 14px 16px;
  font: 16px/1.7 var(--thai);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
  opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: opacity .15s, transform .15s;
}
.tip.show { opacity: 1; transform: none; }
.tip-title { font-weight: 600; font-size: 17px; margin-bottom: 4px; }
.tip-tag { display: inline-block; font-size: 12px; background: #efe2c2; color: #6b4e12; border-radius: 999px; padding: 1px 10px; margin-bottom: 6px; }
.tip::after { content: ""; position: absolute; left: var(--arrow-x, 50%); width: 12px; height: 12px; background: var(--tip-bg); transform: translateX(-50%) rotate(45deg); }
.tip[data-side="top"]::after { bottom: -6px; }
.tip[data-side="bottom"]::after { top: -6px; }

/* Other skills */
.wide { max-width: 1100px; margin: 0 auto; width: 100%; }
.wide h2 { font-size: clamp(26px, 3vw, 40px); margin: 10px 0 20px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.num { text-align: right; }
.warn { cursor: help; border-bottom: 1px dashed var(--gold); }
.unnamed { color: var(--muted); font-style: italic; }

/* Videos */
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.vid { display: block; text-decoration: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: transform .2s, border-color .2s; }
.vid:hover { transform: translateY(-3px); border-color: var(--gold); }
.vid .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
.vid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vid .len { position: absolute; right: 6px; bottom: 6px; background: rgba(0, 0, 0, .8); font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.vid .body { padding: 10px 12px 12px; }
.vid .t { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vid .m { margin-top: 6px; font-size: 12px; color: var(--muted); }
.vid.used { border-color: rgba(111, 214, 255, .5); }
.vid .badge { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--cyan); }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }

/* Navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 16px 18px; background: linear-gradient(transparent, rgba(13, 11, 26, .9) 40%); z-index: 20; }
.nav button.arrow { appearance: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; }
.nav button.arrow:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.nav button.arrow:disabled { opacity: .3; cursor: default; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { appearance: none; border: 0; width: 9px; height: 9px; border-radius: 999px; background: rgba(255, 255, 255, .22); cursor: pointer; padding: 0; transition: width .25s, background .25s; }
.dot.on { width: 26px; background: var(--gold); }
.counter { font: 600 12px var(--sans); color: var(--muted); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

@media (max-width: 820px) {
  .title-grid, .skill-grid { grid-template-columns: 1fr; }
  .title-grid img { max-height: 34dvh; }
  .slide { align-content: start; padding-top: 24px; }
  table { font-size: 13px; }
  th, td { padding: 8px 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .slide, .tip, .vid, .dot { transition: none; }
}
</style>
</head>
<body>
<main class="deck" id="deck" aria-live="polite"></main>
<nav class="nav" aria-label="Slides">
  <button class="arrow" id="prev" aria-label="Previous slide">‹</button>
  <div class="dots" id="dots"></div>
  <span class="counter" id="counter"></span>
  <button class="arrow" id="next" aria-label="Next slide">›</button>
</nav>
<div class="tip" id="tip" role="tooltip" lang="th"></div>

<script src="data.js"></script>
<script>
(() => {
  const D = window.BARON;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = n => new Intl.NumberFormat("en-US").format(n);
  const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const deck = document.getElementById("deck");
  const b = D.boss;

  // Each element carrying data-tip-* gets the Thai tooltip on hover, focus, or tap.
  const tipAttrs = (title, body, tag) =>
    `data-tip-title="${esc(title)}" data-tip-body="${esc(body)}"${tag ? ` data-tip-tag="${esc(tag)}"` : ""} tabindex="0"`;

  const titleSlide = `
    <section class="slide" aria-label="Title">
      <div class="title-grid">
        <img src="img/boss.webp" alt="Shadow Owl Duke artwork">
        <div>
          <div class="eyebrow">Final Mirage · Lv.${b.level} Shadow Dungeon</div>
          <h1>${esc(b.dungeon)}</h1>
          <div class="th-sub th" lang="th">${esc(b.dungeonTh)}</div>
          <p class="boss-line">Boss: <strong>${esc(b.name)}</strong></p>
          <ul class="chips">
            <li class="chip">Lv. <b>${b.level}</b></li>
            <li class="chip">${esc(b.element)}</li>
            <li class="chip">${esc(b.race)}</li>
            <li class="chip">${esc(b.size)} <span class="th" lang="th">· ${esc(b.sizeTh)}</span></li>
            <li class="chip">Party <b>${b.team.join("–")}</b></li>
            <li class="chip">Time <b>${mmss(b.timeLimit)}</b></li>
          </ul>
          <dl class="stats">${b.stats.slice(0, 6).map(s => `<div class="stat"><dt>${esc(s.label)}</dt><dd>${fmt(s.value)}</dd></div>`).join("")}</dl>
          <p class="hint">${D.skills.length} skills · hover any description for Thai · <kbd>←</kbd> <kbd>→</kbd> to move</p>
        </div>
      </div>
    </section>`;

  const skillSlides = D.skills.map((s, i) => `
    <section class="slide" aria-label="${esc(s.name)}">
      <div class="skill-grid">
        <div>
          <div class="video-frame">
            <video src="${esc(s.clip)}" poster="${esc(s.poster)}" muted loop playsinline preload="metadata"></video>
            <div class="video-tools"><button class="icon-btn" data-sound>🔇 Sound</button></div>
          </div>
          <div class="credit">Clip: ${esc(D.source.channel)} — <a href="${esc(s.source)}" target="_blank" rel="noopener">YouTube @ ${esc(s.sourceAt)}</a> · narration in Chinese</div>
        </div>
        <div class="skill-info">
          <div class="skill-num">SKILL ${String(i + 1).padStart(2, "0")} / ${String(D.skills.length).padStart(2, "0")}</div>
          <h2>${esc(s.name)}</h2>
          <div class="th-name th" lang="th">${esc(s.nameTh)}</div>
          ${s.labels.length ? `<ul class="chips">${s.labels.map(l => `<li class="chip tone">${esc(l)}</li>`).join("")}</ul>` : ""}
          <p class="desc" ${tipAttrs(s.nameTh, s.descTh, s.labelsTh[0])}>${esc(s.desc)}</p>
          <div class="desc-hint"><span>TH</span> Hover or tap the description for Thai</div>
        </div>
      </div>
    </section>`);

  const othersSlide = `
    <section class="slide" aria-label="Other skills">
      <div class="wide">
        <div class="eyebrow">Reference</div>
        <h2>Other Skills <span class="th" lang="th" style="font-size:.6em;color:var(--muted)">· สกิลอื่น ๆ</span></h2>
        <table>
          <thead><tr><th>#</th><th>Skill</th><th>Element</th><th class="num">Range</th><th class="num">DMG %</th><th>Cast warning</th></tr></thead>
          <tbody>${D.others.map((o, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${o.name ? esc(o.name) : `<span class="unnamed">Unnamed</span>`}</td>
              <td>${esc(o.element)}</td>
              <td class="num">${o.range}</td>
              <td class="num">${o.dmgPct ? fmt(o.dmgPct) + "%" : "—"}</td>
              <td>${o.warning ? `<span class="warn" ${tipAttrs("คำเตือน", o.warningTh)}>${esc(o.warning)}</span>` : "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>`;

  const videosSlide = `
    <section class="slide" aria-label="Videos">
      <div class="wide">
        <div class="eyebrow">Sources · ${D.videos.length} videos tagged for this boss on roworlddb</div>
        <h2>Full Run Videos</h2>
        <div class="vids">${D.videos.map(v => `
          <a class="vid${v.id === D.source.id ? " used" : ""}" href="${esc(v.url)}" target="_blank" rel="noopener">
            <div class="thumb"><img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy"><span class="len">${esc(v.length)}</span></div>
            <div class="body"><div class="t">${esc(v.title)}</div><div class="m">${esc(v.meta)}</div>${v.id === D.source.id ? `<div class="badge">● Skill clips taken from this video</div>` : ""}</div>
          </a>`).join("")}
        </div>
        <p class="foot">Skill data: roworlddb.com (SEA, en-US / th-TH). Videos belong to their creators.</p>
      </div>
    </section>`;

  deck.innerHTML = [titleSlide, ...skillSlides, othersSlide, videosSlide].join("");
  const slides = [...deck.querySelectorAll(".slide")];

  // Navigation
  const dots = document.getElementById("dots");
  dots.innerHTML = slides.map((s, i) => `<button class="dot" aria-label="Go to slide ${i + 1}: ${esc(s.getAttribute("aria-label"))}"></button>`).join("");
  const dotEls = [...dots.children];
  const prev = document.getElementById("prev"), next = document.getElementById("next"), counter = document.getElementById("counter");
  let cur = -1;
  let soundOn = false;

  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === cur) return;
    hideTip();
    slides.forEach((s, k) => {
      s.classList.toggle("active", k === i);
      const v = s.querySelector("video");
      if (!v) return;
      if (k === i) { v.muted = !soundOn; v.currentTime = 0; v.play().catch(() => {}); }
      else v.pause();
    });
    dotEls.forEach((d, k) => d.classList.toggle("on", k === i));
    prev.disabled = i === 0; next.disabled = i === slides.length - 1;
    counter.textContent = `${i + 1} / ${slides.length}`;
    cur = i;
    history.replaceState(null, "", `#${i + 1}`);
  }
  prev.onclick = () => go(cur - 1);
  next.onclick = () => go(cur + 1);
  dotEls.forEach((d, k) => d.onclick = () => go(k));
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input,textarea")) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    if (e.key === "Home") go(0);
    if (e.key === "End") go(slides.length - 1);
    if (e.key === "Escape") hideTip();
  });
  let touchX = null;
  deck.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1));
  });

  // Sound toggle applies to every clip so it carries across slides.
  deck.addEventListener("click", e => {
    const btn = e.target.closest("[data-sound]");
    if (!btn) return;
    soundOn = !soundOn;
    deck.querySelectorAll("video").forEach(v => v.muted = !soundOn);
    deck.querySelectorAll("[data-sound]").forEach(b => b.textContent = soundOn ? "🔊 Sound" : "🔇 Sound");
  });

  // Thai tooltip
  const tip = document.getElementById("tip");
  let tipFor = null;
  function showTip(el) {
    tipFor = el;
    const tag = el.dataset.tipTag;
    tip.innerHTML = `<div class="tip-title">${esc(el.dataset.tipTitle)}</div>${tag ? `<span class="tip-tag">${esc(tag)}</span>` : ""}<div>${esc(el.dataset.tipBody)}</div>`;
    tip.classList.add("show");
    el.classList.add("tip-open");
    el.setAttribute("aria-describedby", "tip");
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    const above = r.top - t.height - 14 >= 8;
    const top = above ? r.top - t.height - 14 : r.bottom + 14;
    const left = Math.max(16, Math.min(window.innerWidth - t.width - 16, r.left + r.width / 2 - t.width / 2));
    tip.dataset.side = above ? "top" : "bottom";
    tip.style.top = `${top}px`;
    tip.style.left = `${left}px`;
    tip.style.setProperty("--arrow-x", `${Math.max(16, Math.min(t.width - 16, r.left + r.width / 2 - left))}px`);
  }
  function hideTip() {
    if (!tipFor) return;
    tipFor.classList.remove("tip-open");
    tipFor.removeAttribute("aria-describedby");
    tip.classList.remove("show");
    tipFor = null;
  }
  const tipTarget = e => e.target.closest && e.target.closest("[data-tip-body]");
  deck.addEventListener("mouseover", e => { const el = tipTarget(e); if (el && el !== tipFor) showTip(el); });
  deck.addEventListener("mouseout", e => { const el = tipTarget(e); if (el && !el.contains(e.relatedTarget) && document.activeElement !== el) hideTip(); });
  deck.addEventListener("focusin", e => { const el = tipTarget(e); if (el) showTip(el); });
  deck.addEventListener("focusout", e => { if (tipTarget(e)) hideTip(); });
  window.addEventListener("resize", () => tipFor && showTip(tipFor));
  deck.addEventListener("scroll", hideTip, true);

  const fromHash = () => go((parseInt(location.hash.slice(1), 10) || 1) - 1);
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
